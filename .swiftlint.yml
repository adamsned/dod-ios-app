# SwiftLint config — enforces constitution §10
# Warnings fail the build (run with --strict)

included:
  - App
  - AppTests
  - Packages
  - Widget
  - LiveActivity

excluded:
  - .build
  - .swiftpm
  - DerivedData
  - Packages/*/.build
  - Packages/*/.swiftpm

# Opt-in rules we want
opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - file_header
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - implicit_return
  - joined_default_parameter
  - last_where
  - literal_expression_end_indentation
  - multiline_arguments
  - multiline_function_chains
  - multiline_literal_brackets
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - yoda_condition

disabled_rules:
  - todo  # we use a stricter custom rule below
  - line_length  # enforced by swift-format instead
  - trailing_comma  # swift-format requires trailing commas; let it own this style

# Custom rule: TODOs must have a date and an owner (constitution §10)
custom_rules:
  todo_with_owner:
    name: "TODO needs date + owner"
    regex: '(?i)//\s*(TODO|FIXME)(?!.*\(\d{4}-\d{2}-\d{2},\s*\w+\))'
    message: "TODO/FIXME must include (YYYY-MM-DD, owner) — e.g. // TODO(2026-06-01, nadams): ..."
    severity: warning

  force_try_banned:
    name: "force-try banned"
    regex: 'try!'
    message: "force-try banned outside tests (constitution §10). Use try? or do/catch."
    excluded: ".*Tests\\.swift"
    severity: error

  # DUT-609/914/915: bare Int(<Double>) TRAPS (SIGTRAP) on a huge/NaN value —
  # e.g. a 20+ digit quantity from untrusted JSON-LD. Prefer Int(exactly:) with
  # a fallback. The known bounded-input sites (timer/image/charcoal/playback,
  # not untrusted) are excluded; add `// swiftlint:disable:this` with a
  # bounded-input justification for any other genuinely-safe use.
  int_from_double_traps:
    name: "Int(Double) can trap"
    regex: 'Int\((?!exactly:)[^\n]*\.rounded\(\)'
    message: "Int(Double) traps on a huge/NaN value (DUT-609/914/915). Use Int(exactly:) with a fallback."
    excluded: ".*(FirstCookoutView\\+TimerFormat|CookThumbnailLoader|CookStepTimer|CookModeViewModel\\+Voice|DutchOvenHeatCoach|CharcoalRecipeConverter|Tests)\\.swift"
    severity: warning

# Tunables
identifier_name:
  min_length:
    warning: 2
  excluded:
    - id
    - x
    - y
    - to
    - in
    - or

type_name:
  min_length:
    warning: 3

file_length:
  warning: 400
  error: 600

function_body_length:
  warning: 50
  error: 80

cyclomatic_complexity:
  warning: 10
  error: 15

nesting:
  type_level:
    warning: 2

analyzer_rules:
  - unused_import

# Per-rule overrides
force_unwrapping:
  severity: error

reporter: "xcode"
