name: DODApp
options:
  bundleIdPrefix: com.dutchovendaddy
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: complete
    # SwiftLint build-phase needs to read .swiftlint.yml outside its sandbox.
    # CI still runs lint via bin/lint.sh as a separate job, which is the real gate.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

# Local Swift packages — wired up in T-006
packages:
  DODDomain:
    path: Packages/DODDomain
  DODSupport:
    path: Packages/DODSupport
  DODDesignSystem:
    path: Packages/DODDesignSystem
  DODAnalytics:
    path: Packages/DODAnalytics
  DODNetworking:
    path: Packages/DODNetworking
  DODPersistence:
    path: Packages/DODPersistence
  DODFeatureFeed:
    path: Packages/DODFeatureFeed
  DODFeatureCategories:
    path: Packages/DODFeatureCategories
  DODFeatureSearch:
    path: Packages/DODFeatureSearch
  DODFeatureRecipeDetail:
    path: Packages/DODFeatureRecipeDetail
  DODFeatureSaved:
    path: Packages/DODFeatureSaved

targets:
  DODApp:
    type: application
    platform: iOS
    sources:
      - path: App
    info:
      path: App/Info.plist
      # These keys MUST live here in project.yml. `xcodegen generate`
      # regenerates App/Info.plist on every run and silently strips any
      # hand-edited keys. We've fixed the same letterbox bug twice now
      # because UILaunchScreen kept getting clobbered — keep it here.
      properties:
        LSRequiresIPhoneOS: true
        # UILaunchScreen is required for iOS to render edge-to-edge on
        # modern devices (notch, Dynamic Island, home indicator). Without
        # this key iOS letterboxes the app, producing large black bars
        # top and bottom. Empty dict = default system background.
        UILaunchScreen: {}
        # Opt the host app in to Live Activities (US-11). Required for
        # `ActivityKit.Activity.request` to succeed at runtime — without
        # this key, `ActivityAuthorizationInfo().areActivitiesEnabled`
        # returns false and Cook Mode timers can't surface on the Lock
        # Screen / Dynamic Island.
        NSSupportsLiveActivities: true
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Deep-link scheme `dod://` for App Intents + Siri Shortcuts (US-10).
        # Routed by `RootView.handle(intent:)` into the right tab + path.
        CFBundleURLTypes:
          - CFBundleURLName: com.dutchovendaddy.DODApp.deeplink
            CFBundleURLSchemes:
              - dod
        # US-41 / AC-41.6 / CL-99 (T-702): silent-push wake-up for the
        # SwiftData → CloudKit private-DB sync adapter. SwiftData's
        # default `CKDatabaseSubscription` registers the app for silent
        # push notifications on private-DB changes; when the user saves
        # a recipe on Device A, Apple's CloudKit infra fires a silent
        # push to Device B, which wakes the background sync process and
        # pulls the change. Per CL-99 we accept SwiftData's default
        # subscription posture; this background mode is what makes the
        # silent push deliverable. The entry MUST live both here in
        # `project.yml` (the canonical source XcodeGen reads) and the
        # regenerated `App/Info.plist` — the REG-INFO-PLIST-CLOBBER fix
        # established that `xcodegen generate` rewrites `Info.plist`
        # from this `properties:` block on every run.
        UIBackgroundModes:
          - remote-notification
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dutchovendaddy.DODApp
        TARGETED_DEVICE_FAMILY: "1,2"  # iPhone + iPad
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: App/DODApp.entitlements
    dependencies:
      - package: DODDomain
      - package: DODSupport
      - package: DODDesignSystem
      - package: DODAnalytics
      - package: DODNetworking
      - package: DODPersistence
      - package: DODFeatureFeed
      - package: DODFeatureCategories
      - package: DODFeatureSearch
      - package: DODFeatureRecipeDetail
      - package: DODFeatureSaved
      # Widget extension (home-screen, US-9).
      - target: DODAppWidget
      # Live Activity extension (Cook Mode timer, US-11).
      - target: DODAppLiveActivity
        embed: true
    preBuildScripts:
      - name: SwiftLint
        script: |
          if which swiftlint > /dev/null; then
            swiftlint --strict --config .swiftlint.yml
          else
            echo "warning: SwiftLint not installed — brew install swiftlint"
          fi
        basedOnDependencyAnalysis: false

  # Home-screen widget (US-9). One WidgetBundle hosting one
  # StaticConfiguration (`FeaturedRecipeWidget`) in small + medium sizes.
  # Reads the snapshot the host app writes into the shared App Group
  # `group.com.dutchovendaddy.DODApp`; tap-throughs deep-link into the app
  # via `dod://recipe/<id>` handled by RootView.onOpenURL.
  DODAppWidget:
    type: app-extension
    platform: iOS
    productType: app-extension
    sources:
      - path: Widget
        excludes:
          - "DODAppWidget.entitlements"
          - "Info.plist"
    info:
      path: Widget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dutchovendaddy.DODApp.Widget
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/DODAppWidget.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - package: DODSupport
        product: DODSupport
      - package: DODDesignSystem
        product: DODDesignSystem

  # Live Activity extension hosting ActivityConfiguration for the
  # Cook Mode countdown timer (US-11). Separate from the home-screen
  # widget so each can be iterated on independently.
  DODAppLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: LiveActivity
    info:
      path: LiveActivity/Info.plist
      properties:
        CFBundleDisplayName: DOD Live Activity
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dutchovendaddy.DODApp.LiveActivity
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: LiveActivity/Info.plist
        SKIP_INSTALL: YES
    dependencies:
      - package: DODFeatureRecipeDetail
      - package: DODDesignSystem
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework

  DODAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
        # Carve the L5 E2E sources out of the L3 smoke target. The E2E
        # journeys live alongside the smoke tests under `UITests/` (shared
        # bundle infra) but compile into their own scheme (`DODAppE2ETests`
        # below) so the smoke job stays fast and runs every PR while the
        # E2E job runs label-gated. Spec trace: AC-T5 / CL-58.
        excludes:
          - "E2E"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dutchovendaddy.DODAppUITests
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_TARGET_NAME: DODApp
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: DODApp

  # L5 End-to-end user journeys (AC-T5 / CL-58 — Phase 11). Same XCUITest
  # framework as the L3 smoke target, just a separate scheme + source root
  # so CI can invoke them independently with `-only-testing:` and gate
  # them behind the `e2e` PR label. The first five journeys live in
  # `UITests/E2E/CoreUserJourneysE2ETests.swift` (T-603); future PRs
  # extend the suite as the feature surface grows.
  DODAppE2ETests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests/E2E
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dutchovendaddy.DODAppE2ETests
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_TARGET_NAME: DODApp
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: DODApp

  # Host-app unit tests. App-target Swift types that aren't worth lifting
  # into a feature package (e.g. `AppTab`, route enums, deep-link parsers
  # that touch SwiftUI state) live here. Most domain logic still belongs
  # in `Packages/<Feature>/Tests/` (constitution §6 L1) — this target is
  # for the small island of App-target code that can't be packaged.
  #
  # Added in T-310 (US-16) to pin the `AppTab.allCases` order so a future
  # refactor can't silently re-shuffle the bottom tab bar.
  DODAppUnitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dutchovendaddy.DODAppUnitTests
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DODApp.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/DODApp"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: DODApp
