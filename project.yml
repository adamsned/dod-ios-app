name: DODApp
options:
  bundleIdPrefix: com.dutchovendaddy
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: complete
    # SwiftLint build-phase needs to read .swiftlint.yml outside its sandbox.
    # CI still runs lint via bin/lint.sh as a separate job, which is the real gate.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "4"

# Signing team is injected from a gitignored xcconfig so the Apple Team ID
# stays out of this public repo. Without this, `xcodegen generate` produces a
# project with no DEVELOPMENT_TEAM and every Archive fails with "Signing for
# 'DODApp' requires a development team." The file is recreated locally per
# clone (see App/DODApp.xcconfig for the one-liner). Applied to both configs
# at the project level so the app + both extensions inherit it.
configFiles:
  Debug: App/DODApp.xcconfig
  Release: App/DODApp.xcconfig

# Local Swift packages — wired up in T-006
packages:
  DODDomain:
    path: Packages/DODDomain
  DODSupport:
    path: Packages/DODSupport
  DODDesignSystem:
    path: Packages/DODDesignSystem
  DODAnalytics:
    path: Packages/DODAnalytics
  DODNetworking:
    path: Packages/DODNetworking
  DODPersistence:
    path: Packages/DODPersistence
  DODFeatureFeed:
    path: Packages/DODFeatureFeed
  DODFeatureCategories:
    path: Packages/DODFeatureCategories
  DODFeatureSearch:
    path: Packages/DODFeatureSearch
  DODFeatureRecipeDetail:
    path: Packages/DODFeatureRecipeDetail
  DODFeatureSaved:
    path: Packages/DODFeatureSaved
  DODFeatureProfile:
    path: Packages/DODFeatureProfile

targets:
  DODApp:
    type: application
    platform: iOS
    sources:
      - path: App
    info:
      path: App/Info.plist
      # These keys MUST live here in project.yml. `xcodegen generate`
      # regenerates App/Info.plist on every run and silently strips any
      # hand-edited keys. We've fixed the same letterbox bug twice now
      # because UILaunchScreen kept getting clobbered — keep it here.
      properties:
        # User-facing display name (Home Screen, App Switcher, Settings).
        # Distinct from CFBundleName (canonical PRODUCT_NAME from xcodegen).
        # Apple's binary-validator (error 90360) requires CFBundleDisplayName
        # on every app extension; we set it on the host app too for
        # consistency with what users see on the Home Screen.
        CFBundleDisplayName: Dutch Oven Daddy
        # DUT-23: app-identity key for anonymous comment POSTs. The app sends it
        # as the `X-DOD-App-Key` header so WordPress's
        # `rest_allow_anonymous_comments` filter accepts comment creation from
        # the DOD app only. The value is the `DOD_COMMENT_API_KEY` build setting
        # — blank in the committed App/DODApp.xcconfig (no secret in this public
        # repo), injected at archive time from the GitHub `DOD_COMMENT_API_KEY`
        # secret (see .github/workflows/release.yml). Blank in dev / PR builds,
        # where the app omits the header.
        DODCommentAPIKey: "$(DOD_COMMENT_API_KEY)"
        # Export-compliance self-classification. `false` declares the app
        # uses ONLY exempt encryption — i.e. TLS via URLSession, SHA-256
        # hashing via CryptoKit, Keychain via Security framework. Apple
        # treats "encryption accessed only through iOS frameworks" as
        # exempt under EAR Cat 5 Part 2 (no ATEA documentation required).
        # Baking this here skips the App Store Connect "Missing
        # Compliance" prompt on every future build. Audit confirms no
        # CommonCrypto / SecKey direct usage; no proprietary crypto.
        ITSAppUsesNonExemptEncryption: false
        # CFBundleVersion is the build number Apple uses to uniquely
        # identify each TestFlight / App Store submission for this
        # CFBundleShortVersionString. MUST monotonically increase: a
        # build number, once accepted by App Store Connect, can never be
        # re-used. Bump on every upload attempt. xcodegen does NOT read
        # this from `CURRENT_PROJECT_VERSION`; it hardcodes "1" as the
        # default unless explicitly set here.
        CFBundleVersion: "5"
        LSRequiresIPhoneOS: true
        # UILaunchScreen is required for iOS to render edge-to-edge on
        # modern devices (notch, Dynamic Island, home indicator). Without
        # this key iOS letterboxes the app, producing large black bars
        # top and bottom. Empty dict = default system background.
        UILaunchScreen: {}
        # Opt the host app in to Live Activities (US-11). Required for
        # `ActivityKit.Activity.request` to succeed at runtime — without
        # this key, `ActivityAuthorizationInfo().areActivitiesEnabled`
        # returns false and Cook Mode timers can't surface on the Lock
        # Screen / Dynamic Island.
        NSSupportsLiveActivities: true
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Deep-link scheme `dod://` for App Intents + Siri Shortcuts (US-10).
        # Routed by `RootView.handle(intent:)` into the right tab + path.
        CFBundleURLTypes:
          - CFBundleURLName: com.dutchovendaddy.DODApp.deeplink
            CFBundleURLSchemes:
              - dod
        # US-41 / AC-41.6 / CL-99 (T-702): silent-push wake-up for the
        # SwiftData → CloudKit private-DB sync adapter. SwiftData's
        # default `CKDatabaseSubscription` registers the app for silent
        # push notifications on private-DB changes; when the user saves
        # a recipe on Device A, Apple's CloudKit infra fires a silent
        # push to Device B, which wakes the background sync process and
        # pulls the change. Per CL-99 we accept SwiftData's default
        # subscription posture; this background mode is what makes the
        # silent push deliverable. The entry MUST live both here in
        # `project.yml` (the canonical source XcodeGen reads) and the
        # regenerated `App/Info.plist` — the REG-INFO-PLIST-CLOBBER fix
        # established that `xcodegen generate` rewrites `Info.plist`
        # from this `properties:` block on every run.
        UIBackgroundModes:
          - remote-notification
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dutchovendaddy.DODApp
        TARGETED_DEVICE_FAMILY: "1,2"  # iPhone + iPad
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The App target's capabilities are driven entirely by this entitlements
        # file (xcodegen has no first-class capability block; automatic signing +
        # -allowProvisioningUpdates provision whatever it declares). It carries:
        # iCloud/CloudKit, App Groups, and - added for DUT-6 cause #3 - the Push
        # Notifications capability (aps-environment), which is what makes
        # CloudKit live-change pushes DELIVERABLE so the other device syncs
        # instantly instead of on next launch. Pairs with the Info.plist
        # UIBackgroundModes: [remote-notification] above (the signing-neutral
        # half). The App ID must have Push enabled in the Developer portal first;
        # see App/DODApp.entitlements and this feature's PR for the owner step.
        CODE_SIGN_ENTITLEMENTS: App/DODApp.entitlements
    dependencies:
      - package: DODDomain
      - package: DODSupport
      - package: DODDesignSystem
      - package: DODAnalytics
      - package: DODNetworking
      - package: DODPersistence
      - package: DODFeatureFeed
      - package: DODFeatureCategories
      - package: DODFeatureSearch
      - package: DODFeatureRecipeDetail
      - package: DODFeatureSaved
      - package: DODFeatureProfile
      # Widget extension (home-screen, US-9).
      - target: DODAppWidget
      # Live Activity extension (Cook Mode timer, US-11).
      - target: DODAppLiveActivity
        embed: true
    preBuildScripts:
      - name: SwiftLint
        script: |
          if which swiftlint > /dev/null; then
            swiftlint --strict --config .swiftlint.yml
          else
            echo "warning: SwiftLint not installed — brew install swiftlint"
          fi
        basedOnDependencyAnalysis: false

  # Home-screen widget (US-9). One WidgetBundle hosting one
  # StaticConfiguration (`FeaturedRecipeWidget`) in small + medium sizes.
  # Reads the snapshot the host app writes into the shared App Group
  # `group.com.dutchovendaddy.DODApp`; tap-throughs deep-link into the app
  # via `dod://recipe/<id>` handled by RootView.onOpenURL.
  DODAppWidget:
    type: app-extension
    platform: iOS
    productType: app-extension
    sources:
      - path: Widget
        excludes:
          - "DODAppWidget.entitlements"
          - "Info.plist"
    info:
      path: Widget/Info.plist
      properties:
        # REQUIRED by Apple's binary-validator for every .appex extension
        # (error 90360 if missing — App Store Connect rejects the upload).
        # Shown in iPhone Storage / Settings as the extension's identifier;
        # the per-widget gallery labels come from each widget's Swift-side
        # `.configurationDisplayName(...)` call.
        CFBundleDisplayName: DOD Widgets
        # MUST match the host app's CFBundleVersion (Apple's bundle-
        # extension contract — version skew between host + extension
        # rejected at upload).
        CFBundleVersion: "5"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dutchovendaddy.DODApp.Widget
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/DODAppWidget.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - package: DODSupport
        product: DODSupport
      - package: DODDesignSystem
        product: DODDesignSystem

  # Live Activity extension hosting ActivityConfiguration for the
  # Cook Mode countdown timer (US-11). Separate from the home-screen
  # widget so each can be iterated on independently.
  DODAppLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: LiveActivity
    info:
      path: LiveActivity/Info.plist
      properties:
        CFBundleDisplayName: DOD Live Activity
        # MUST match the host app's CFBundleVersion (Apple's bundle-
        # extension contract).
        CFBundleVersion: "5"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dutchovendaddy.DODApp.LiveActivity
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: LiveActivity/Info.plist
        SKIP_INSTALL: YES
    dependencies:
      - package: DODFeatureRecipeDetail
      - package: DODDesignSystem
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework

  DODAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
        # Carve the L5 E2E sources out of the L3 smoke target. The E2E
        # journeys live alongside the smoke tests under `UITests/` (shared
        # bundle infra) but compile into their own scheme (`DODAppE2ETests`
        # below) so the smoke job stays fast and runs every PR while the
        # E2E job runs label-gated. Spec trace: AC-T5 / CL-58.
        excludes:
          - "E2E"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dutchovendaddy.DODAppUITests
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_TARGET_NAME: DODApp
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: DODApp

  # L5 End-to-end user journeys (AC-T5 / CL-58 — Phase 11). Same XCUITest
  # framework as the L3 smoke target, just a separate scheme + source root
  # so CI can invoke them independently with `-only-testing:` and gate
  # them behind the `e2e` PR label. The first five journeys live in
  # `UITests/E2E/CoreUserJourneysE2ETests.swift` (T-603); future PRs
  # extend the suite as the feature surface grows.
  DODAppE2ETests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests/E2E
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dutchovendaddy.DODAppE2ETests
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_TARGET_NAME: DODApp
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: DODApp

  # Host-app unit tests. App-target Swift types that aren't worth lifting
  # into a feature package (e.g. `AppTab`, route enums, deep-link parsers
  # that touch SwiftUI state) live here. Most domain logic still belongs
  # in `Packages/<Feature>/Tests/` (constitution §6 L1) — this target is
  # for the small island of App-target code that can't be packaged.
  #
  # Added in T-310 (US-16) to pin the `AppTab.allCases` order so a future
  # refactor can't silently re-shuffle the bottom tab bar.
  DODAppUnitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dutchovendaddy.DODAppUnitTests
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DODApp.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/DODApp"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: DODApp
