name: Nightly Live API

on:
  schedule:
    # 07:00 UTC daily = midnight Pacific
    - cron: "0 7 * * *"
  workflow_dispatch:  # manual trigger

jobs:
  test-live-api:
    name: L2 Live API · dutchovendaddy.com
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Run live integration tests
        working-directory: Packages/DODIntegrationTests
        env:
          DOD_RUN_LIVE_TESTS: "1"
        run: swift test --parallel

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const today = new Date().toISOString().split('T')[0];
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Nightly live-API contract drift detected (${today})`,
              body: `The nightly L2 live-API test job failed against dutchovendaddy.com.\n\nThis is an early warning that the WP REST or recipe-page contract drifted. See the failed workflow for details:\n${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['live-api', 'auto-filed'],
            });
