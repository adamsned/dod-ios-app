name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: macos-14
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Run SwiftLint (strict)
        run: bin/lint.sh

  format:
    name: Format check
    runs-on: macos-14
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install swift-format
        run: brew install swift-format
      - name: Check formatting
        run: swift-format lint --recursive --strict --configuration .swift-format App Packages

  # L1: per-package unit tests (Swift Testing). Fast, isolated.
  test-unit-packages:
    name: L1 Unit · ${{ matrix.package }}
    runs-on: macos-14
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package:
          - DODDomain
          - DODSupport
          - DODAnalytics
          - DODNetworking
          - DODPersistence
          - DODFeatureFeed
          - DODFeatureCategories
          - DODFeatureSearch
          - DODFeatureRecipeDetail
          - DODFeatureSaved
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16 (Swift 6.0)
        # All packages declare swift-tools-version: 6.0. The macos-14 default
        # Xcode is 15.4 which ships Swift 5.10 and fails immediately; pin
        # 16.x explicitly so `swift test` uses the right toolchain.
        run: sudo xcode-select -s /Applications/Xcode_16.app
      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: Packages/${{ matrix.package }}/.build
          key: ${{ runner.os }}-spm-xcode16-${{ matrix.package }}-${{ hashFiles(format('Packages/{0}/Package.swift', matrix.package)) }}
      - name: Test
        working-directory: Packages/${{ matrix.package }}
        run: swift test --parallel

  # L4: DesignSystem snapshots run on iOS simulator (UIKit dependency).
  test-snapshots-designsystem:
    name: L4 Snapshots · DODDesignSystem
    runs-on: macos-14
    timeout-minutes: 15
    needs: [lint, format]
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16 (Swift 6.0)
        run: sudo xcode-select -s /Applications/Xcode_16.app
      - name: Test on iOS simulator
        working-directory: Packages/DODDesignSystem
        run: |
          set -o pipefail
          xcodebuild \
            -scheme DODDesignSystem \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            test | xcpretty
      - name: Upload snapshot diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-diffs
          path: Packages/DODDesignSystem/Tests/DODDesignSystemTests/__Snapshots__/

  build-app:
    name: Build app (iOS Simulator)
    runs-on: macos-14
    timeout-minutes: 25
    needs: [lint, format]
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16 (Swift 6.0)
        run: sudo xcode-select -s /Applications/Xcode_16.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project DODApp.xcodeproj \
            -scheme DODApp \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -configuration Debug \
            build | xcpretty

  # L3: UI smoke tests against the built app on a live simulator.
  test-ui-smoke:
    name: L3 UI Smoke
    runs-on: macos-14
    timeout-minutes: 30
    needs: [build-app]
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16 (Swift 6.0)
        run: sudo xcode-select -s /Applications/Xcode_16.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Run UI tests
        run: |
          set -o pipefail
          xcodebuild \
            -project DODApp.xcodeproj \
            -scheme DODApp \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -only-testing:DODAppUITests \
            test | xcpretty
      - name: Upload UI test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult

  # Aggregate gate so branch protection can require a single check.
  # Nightly L2 live-API tests live in .github/workflows/nightly-live-api.yml.
  ci-required:
    name: CI required
    runs-on: ubuntu-latest
    needs: [lint, format, test-unit-packages, test-snapshots-designsystem, build-app, test-ui-smoke]
    steps:
      - run: echo "All required CI jobs passed."
