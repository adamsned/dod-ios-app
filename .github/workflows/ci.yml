name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Path filtering — docs/spec/marketing-only changes don't need the
# (expensive) macOS-runner pipeline. The "code-changed" job is the
# single source of truth: every downstream job reads it.
jobs:
  changes:
    name: Detect path changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ steps.filter.outputs.code }}
      ios_sim: ${{ steps.filter.outputs.ios_sim }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          # `code` triggers lint/format/L1. `ios_sim` triggers the
          # heavy iOS-Simulator jobs (snapshot, build, UI smoke).
          # iOS-Sim is gated more strictly so a Linux-only fix
          # (e.g. README, spec, CONTRIBUTING) doesn't pay simulator
          # boot time.
          filters: |
            code:
              - 'App/**'
              - 'Packages/**'
              - 'project.yml'
              - '.swift-format'
              - '.swiftlint.yml'
              - 'bin/**'
              - '.github/workflows/ci.yml'
            ios_sim:
              - 'App/**'
              - 'Packages/**'
              - 'project.yml'
              - '.github/workflows/ci.yml'

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-14
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Run SwiftLint (strict)
        run: bin/lint.sh

  format:
    name: Format check
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-14
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install swift-format
        run: brew install swift-format
      - name: Check formatting
        run: swift-format lint --recursive --strict --configuration .swift-format App AppTests Packages

  # L1: all package unit tests in ONE macOS job. We previously ran
  # this as a 10-job matrix; each parallel job has a ~60s billed
  # minimum on macOS, so the matrix burned ~10 macOS minutes per push
  # for ~30s of actual work. Serial drops total billed time ~3-4x.
  # Trade-off: wall-clock test time is longer (~3-4min vs ~30s
  # parallel) but unit tests are tiny so it barely matters.
  test-unit-packages:
    name: L1 Unit · all packages
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16 (Swift 6.0)
        # All packages declare swift-tools-version: 6.0. The macos-14
        # default Xcode is 15.4 / Swift 5.10 which fails immediately;
        # pin 16.x so `swift test` finds the right toolchain.
        run: sudo xcode-select -s /Applications/Xcode_16.app
      - name: Cache SPM build outputs
        uses: actions/cache@v4
        with:
          path: |
            Packages/*/.build
          key: ${{ runner.os }}-spm-xcode16-${{ hashFiles('Packages/*/Package.swift') }}
      - name: Test all packages sequentially
        # Bash loop so a single failure surfaces clearly. `set -e`
        # makes the loop fail-fast at the first broken package.
        run: |
          set -e
          for pkg in DODDomain DODSupport DODAnalytics DODNetworking \
                     DODPersistence DODFeatureFeed DODFeatureCategories \
                     DODFeatureSearch DODFeatureRecipeDetail DODFeatureSaved; do
            echo "::group::swift test — $pkg"
            (cd "Packages/$pkg" && swift test --parallel)
            echo "::endgroup::"
          done

  # L4: DesignSystem snapshots run on iOS simulator (UIKit dependency).
  test-snapshots-designsystem:
    name: L4 Snapshots · DODDesignSystem
    needs: [changes, lint, format]
    if: needs.changes.outputs.ios_sim == 'true'
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16 (Swift 6.0)
        run: sudo xcode-select -s /Applications/Xcode_16.app
      - name: Test on iOS simulator
        working-directory: Packages/DODDesignSystem
        run: |
          set -o pipefail
          xcodebuild \
            -scheme DODDesignSystem \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            test | xcpretty
      - name: Upload snapshot diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-diffs
          path: Packages/DODDesignSystem/Tests/DODDesignSystemTests/__Snapshots__/

  build-app:
    name: Build app (iOS Simulator)
    needs: [changes, lint, format]
    if: needs.changes.outputs.ios_sim == 'true'
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16 (Swift 6.0)
        run: sudo xcode-select -s /Applications/Xcode_16.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project DODApp.xcodeproj \
            -scheme DODApp \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -configuration Debug \
            build | xcpretty

  # L1 (host-app slice): unit tests against App-target types that can't
  # be lifted into a feature package — currently just AppTab. Most domain
  # logic still lives in Packages/*/Tests/ (test-unit-packages above).
  # Gated behind the iOS-Sim path filter since it depends on xcodebuild +
  # the simulator; skipped on docs-only PRs.
  test-unit-app:
    name: L1 Unit · DODApp
    needs: [changes, build-app]
    if: needs.changes.outputs.ios_sim == 'true'
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16 (Swift 6.0)
        run: sudo xcode-select -s /Applications/Xcode_16.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild \
            -project DODApp.xcodeproj \
            -scheme DODApp \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -only-testing:DODAppUnitTests \
            test | xcpretty

  # L3: UI smoke tests against the built app on a live simulator.
  test-ui-smoke:
    name: L3 UI Smoke
    needs: [changes, build-app]
    if: needs.changes.outputs.ios_sim == 'true'
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16 (Swift 6.0)
        run: sudo xcode-select -s /Applications/Xcode_16.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Run UI tests
        run: |
          set -o pipefail
          xcodebuild \
            -project DODApp.xcodeproj \
            -scheme DODApp \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -only-testing:DODAppUITests \
            test | xcpretty
      - name: Upload UI test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult

  # Aggregate gate. Runs even when upstream jobs were skipped (e.g.
  # docs-only PR) so the PR can show a single green "CI required"
  # check regardless of which jobs actually executed. Fails if any
  # required upstream job failed; succeeds if they passed OR were
  # skipped because path filters excluded them.
  ci-required:
    name: CI required
    needs: [changes, lint, format, test-unit-packages, test-unit-app,
            test-snapshots-designsystem, build-app, test-ui-smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate result
        run: |
          # Each input is "success", "failure", "cancelled", or "skipped".
          # Skipped is fine (path filter excluded the job); failure is not.
          for name in changes lint format test-unit-packages test-unit-app \
                     test-snapshots-designsystem build-app test-ui-smoke; do
            result_var="${name//-/_}_RESULT"
            echo "$name: ${!result_var:-not-run}"
          done
          if [[ "${{ needs.changes.result }}" == "failure" \
             || "${{ needs.lint.result }}" == "failure" \
             || "${{ needs.format.result }}" == "failure" \
             || "${{ needs.test-unit-packages.result }}" == "failure" \
             || "${{ needs.test-unit-app.result }}" == "failure" \
             || "${{ needs.test-snapshots-designsystem.result }}" == "failure" \
             || "${{ needs.build-app.result }}" == "failure" \
             || "${{ needs.test-ui-smoke.result }}" == "failure" ]]; then
            echo "::error::At least one required CI job failed."
            exit 1
          fi
          echo "All required CI jobs passed (or were skipped by path filter)."
