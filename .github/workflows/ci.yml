name: CI

on:
  pull_request:
    branches: [main]
    # The label-conditional `test-e2e` job (below) reads
    # `github.event.pull_request.labels.*.name`. The `labeled` /
    # `unlabeled` events are required so the job re-evaluates when an
    # author adds or removes the `e2e` label after the PR is opened.
    # Without these triggers the job would only see the labels present
    # at PR-open time. Spec trace: AC-T5 / CL-58.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  # L5 E2E nightly safety net + manual escape hatch. Pairs with
  # `nightly-live-api.yml`'s cron at the same 07:00 UTC so both early
  # warning surfaces fire at the same wall clock. Spec trace:
  # AC-T5 / CL-58.
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Path filtering — docs/spec/marketing-only changes don't need the
# (expensive) macOS-runner pipeline. The "code-changed" job is the
# single source of truth: every downstream job reads it.
jobs:
  changes:
    name: Detect path changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ steps.filter.outputs.code }}
      ios_sim: ${{ steps.filter.outputs.ios_sim }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          # `code` triggers lint/format/L1. `ios_sim` triggers the
          # heavy iOS-Simulator jobs (snapshot, build, UI smoke).
          # iOS-Sim is gated more strictly so a Linux-only fix
          # (e.g. README, spec, CONTRIBUTING) doesn't pay simulator
          # boot time.
          filters: |
            code:
              - 'App/**'
              - 'Packages/**'
              # Embedded app-extension sources are now linted + swift-format
              # checked (.swiftlint.yml `included` + the format job below), so an
              # extension-only change must run lint + format. This also triggers
              # L1-packages — a minor, accepted cost on the rare extension-only
              # PR (the extensions link against those packages anyway).
              - 'Widget/**'
              - 'LiveActivity/**'
              - 'project.yml'
              - '.swift-format'
              - '.swiftlint.yml'
              - 'bin/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            ios_sim:
              - 'App/**'
              - 'Packages/**'
              - 'project.yml'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Warm Homebrew so `brew install` below skips the bottle download.
      # Cache ONLY Homebrew's download cache — NOT the tool keg
      # (/opt/homebrew/Cellar/...). Caching the keg made `brew install` see
      # the tool as already installed on a cache HIT and skip creating the
      # /opt/homebrew/bin symlink, so the binary was never on PATH ("command
      # not found"). With downloads-only, `brew install` always installs +
      # links the tool (fast, since the bottle is pre-downloaded). Keys are
      # at -v2 to bypass the poisoned -v1 caches that still hold a keg.
      - name: Cache Homebrew (swiftlint)
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: ${{ runner.os }}-brew-swiftlint-v2
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Run SwiftLint (strict)
        run: bin/lint.sh

  format:
    name: Format check
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # See the lint job for why we cache downloads only, not the keg.
      # swift-format ships no prebuilt macOS release artifact (Apple
      # publishes source-only tags), so caching the Homebrew bottle
      # download is the reliable way to make this install warm.
      - name: Cache Homebrew (swift-format)
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: ${{ runner.os }}-brew-swift-format-v2
      - name: Install swift-format
        run: brew install swift-format
      - name: Check formatting
        run: swift-format lint --recursive --strict --configuration .swift-format App AppTests Packages Widget LiveActivity

  # L1: all package unit tests in ONE macOS job. We previously ran
  # this as a 10-job matrix; each parallel job has a ~60s billed
  # minimum on macOS, so the matrix burned ~10 macOS minutes per push
  # for ~30s of actual work. Serial drops total billed time ~3-4x.
  # Trade-off: wall-clock test time is longer (~3-4min vs ~30s
  # parallel) but unit tests are tiny so it barely matters.
  test-unit-packages:
    name: L1 Unit · all packages
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26 (Swift 6 / iOS 26 SDK)
        # All packages declare swift-tools-version: 6.0. The macos-15
        # runner's default Xcode is 16.4; we pin the newest Xcode 26 so the
        # toolchain + iOS 26 SDK match local dev (where the snapshot
        # baselines are recorded) and so the iOS-Simulator jobs find the
        # iPhone 17 sim. GitHub does NOT ship a bare `Xcode_26.app` symlink
        # (only versioned paths like Xcode_26.3.app), so glob + sort -V +
        # tail -1 picks the newest installed 26.x — robust across image
        # updates that bump the patch version.
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
      # Cache the per-package .build dirs AND the global SwiftPM caches so
      # `swift test` reuses resolved + compiled dependencies instead of
      # re-fetching and recompiling them cold every run. Keyed on a hash of
      # all package manifests (Package.resolved is gitignored here, so the
      # manifests are the source of truth for the dependency graph); the
      # restore-keys fallback warms most of the build on a near-miss (e.g.
      # one manifest changed). A miss still does a correct cold build.
      - name: Cache SPM build outputs
        uses: actions/cache@v4
        with:
          path: |
            Packages/*/.build
            ~/.swiftpm
            ~/.cache/org.swift.swiftpm
          key: ${{ runner.os }}-spm-xcode26-${{ hashFiles('Packages/*/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-xcode26-
      - name: Test all packages sequentially
        # Bash loop so a single failure surfaces clearly. `set -e`
        # makes the loop fail-fast at the first broken package.
        run: |
          set -e
          for pkg in DODDomain DODSupport DODAnalytics DODNetworking \
                     DODPersistence DODFeatureFeed DODFeatureCategories \
                     DODFeatureSearch DODFeatureRecipeDetail DODFeatureSaved; do
            echo "::group::swift test — $pkg"
            (cd "Packages/$pkg" && swift test --parallel)
            echo "::endgroup::"
          done

  # L4: DesignSystem snapshots run on iOS simulator (UIKit dependency).
  test-snapshots-designsystem:
    name: L4 Snapshots · DODDesignSystem
    needs: [changes, lint, format]
    if: needs.changes.outputs.ios_sim == 'true'
    runs-on: macos-15
    # 30 (was 15): the ensure-ios-simulator action now downloads the iOS
    # runtime on cold runners (Xcode 26 on macos-15 ships without it), which
    # needs headroom on top of the snapshot build+test.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26 (Swift 6 / iOS 26 SDK)
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
      # Cache the SwiftPM packages xcodebuild resolves into DerivedData so
      # swift-snapshot-testing isn't re-cloned + re-resolved on every run.
      # We pin -derivedDataPath below so this path is deterministic. Only
      # SourcePackages (resolved dep clones) is cached here, NOT the build
      # products — this is the correctness-critical L4 snapshot gate, so the
      # test binary is always rebuilt; only the dependency fetch is warmed.
      # Keyed on the manifest hash; restore-keys warms near-misses; a miss
      # cold-resolves exactly like today.
      - name: Cache SPM (DerivedData SourcePackages)
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/DODDesignSystem-cache/SourcePackages
          key: ${{ runner.os }}-xcode26-srcpkgs-designsystem-${{ hashFiles('Packages/*/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-xcode26-srcpkgs-designsystem-
      # Guarantee the iPhone 17 device exists + is booted (the runner image
      # intermittently ships without it). Snapshot baselines are geometry-
      # locked to iPhone 17, so this must be that exact device, not a
      # substitute — the action creates it if missing rather than falling back.
      - name: Ensure iPhone 17 simulator
        id: sim
        uses: ./.github/actions/ensure-ios-simulator
      - name: Test on iOS simulator
        working-directory: Packages/DODDesignSystem
        env:
          DESTINATION: ${{ steps.sim.outputs.destination }}
        run: |
          set -o pipefail
          xcodebuild \
            -scheme DODDesignSystem \
            -destination "$DESTINATION" \
            -derivedDataPath ~/Library/Developer/Xcode/DerivedData/DODDesignSystem-cache \
            test | xcpretty
      - name: Upload snapshot diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-diffs
          path: Packages/DODDesignSystem/Tests/DODDesignSystemTests/__Snapshots__/

  build-app:
    name: Build app (iOS Simulator)
    needs: [changes, lint, format]
    if: needs.changes.outputs.ios_sim == 'true'
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26 (Swift 6 / iOS 26 SDK)
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
      # Warm Homebrew for xcodegen (HIT relinks in seconds, MISS cold-installs).
      - name: Cache Homebrew (xcodegen)
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: ${{ runner.os }}-brew-xcodegen-v2
      - name: Install XcodeGen
        run: brew install xcodegen
      # Cache the SwiftPM deps xcodebuild resolves into DerivedData so the
      # app's packages (TelemetryDeck SwiftSDK, swift-snapshot-testing, ...)
      # are not re-cloned + re-resolved every run. Keyed on the manifest hash.
      - name: Cache SPM (DerivedData SourcePackages)
        uses: actions/cache@v4
        with:
          path: DerivedData/SourcePackages
          key: ${{ runner.os }}-xcode26-srcpkgs-app-${{ hashFiles('Packages/*/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-xcode26-srcpkgs-app-
      # Biggest win: cache the app's DerivedData so the build is INCREMENTAL
      # instead of from scratch. The key is a content hash of every build
      # input (project.yml + all App and Packages sources); when any source
      # changes the key changes. restore-keys lets a near-miss reuse the
      # previous DerivedData as a warm starting point.
      #
      # Correctness: this can NEVER produce a wrong result. xcodebuild's
      # incremental build system re-checks every file's inputs against the
      # cached module/object timestamps + hashes and recompiles anything
      # whose inputs differ; a stale or partial-hit DerivedData is treated
      # exactly like a local incremental build (which is how dev works). A
      # full miss is identical to today's cold build.
      - name: Cache DerivedData (incremental app build)
        uses: actions/cache@v4
        with:
          path: DerivedData/Build
          key: ${{ runner.os }}-xcode26-derived-app-${{ hashFiles('project.yml', 'App/**', 'Packages/**/Sources/**', 'Packages/*/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-xcode26-derived-app-
      - name: Generate project
        run: xcodegen generate
      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          # Build-only: no booted device required, so use the device-agnostic
          # generic simulator destination. This sidesteps the "Unable to find
          # a device ... name:iPhone 17" flake entirely — there is no device
          # name to match. (Test jobs that DO need a booted sim use the
          # ensure-ios-simulator action instead.)
          xcodebuild \
            -project DODApp.xcodeproj \
            -scheme DODApp \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath DerivedData \
            build | xcpretty

  # L1 (host-app slice): unit tests against App-target types that can't
  # be lifted into a feature package — currently just AppTab. Most domain
  # logic still lives in Packages/*/Tests/ (test-unit-packages above).
  # Gated behind the iOS-Sim path filter since it depends on xcodebuild +
  # the simulator; skipped on docs-only PRs.
  test-unit-app:
    name: L1 Unit · DODApp
    needs: [changes, build-app]
    if: needs.changes.outputs.ios_sim == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26 (Swift 6 / iOS 26 SDK)
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
      - name: Cache Homebrew (xcodegen)
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: ${{ runner.os }}-brew-xcodegen-v2
      - name: Cache SPM (DerivedData SourcePackages)
        uses: actions/cache@v4
        with:
          path: DerivedData/SourcePackages
          key: ${{ runner.os }}-xcode26-srcpkgs-app-${{ hashFiles('Packages/*/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-xcode26-srcpkgs-app-
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Ensure iPhone 17 simulator
        id: sim
        uses: ./.github/actions/ensure-ios-simulator
      - name: Run unit tests
        env:
          DESTINATION: ${{ steps.sim.outputs.destination }}
        run: |
          set -o pipefail
          xcodebuild \
            -project DODApp.xcodeproj \
            -scheme DODApp \
            -destination "$DESTINATION" \
            -derivedDataPath DerivedData \
            -only-testing:DODAppUnitTests \
            test | xcpretty

  # L3: UI smoke tests against the built app on a live simulator.
  test-ui-smoke:
    name: L3 UI Smoke (${{ matrix.device }})
    needs: [changes, build-app]
    if: needs.changes.outputs.ios_sim == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    # Device matrix (DUT-16 follow-up): the smoke suite runs on iPhone 14/15/16/17
    # so a layout/regression that only shows on an older/smaller iPhone is caught.
    # iPad runs the full SmokeTests class too: the suite is device-agnostic
    # (waits on the Settings gear, not a tab bar; a sidebar-aware nav helper
    # handles tab navigation), and the two genuinely iPhone-bottom-tab tests
    # self-skip on iPad (XCTSkipIf — iPad uses a sidebar, US-38 / DUT-89).
    # `fail-fast: false` so one device's flake doesn't sink the others.
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: "iPhone 14"
            only_testing: "-only-testing:DODAppUITests"
          - device: "iPhone 15"
            only_testing: "-only-testing:DODAppUITests"
          - device: "iPhone 16"
            only_testing: "-only-testing:DODAppUITests"
          - device: "iPhone 17"
            only_testing: "-only-testing:DODAppUITests"
          - device: "iPad Pro 11-inch (M5)"
            only_testing: "-only-testing:DODAppUITests/SmokeTests"
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26 (Swift 6 / iOS 26 SDK)
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
      - name: Cache Homebrew (xcodegen)
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: ${{ runner.os }}-brew-xcodegen-v2
      - name: Cache SPM (DerivedData SourcePackages)
        uses: actions/cache@v4
        with:
          path: DerivedData/SourcePackages
          key: ${{ runner.os }}-xcode26-srcpkgs-app-${{ hashFiles('Packages/*/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-xcode26-srcpkgs-app-
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      # Guarantee a booted iPhone 17 (create-if-missing) and pin the
      # destination by UDID — replaces the previous inline "prefer iPhone 17,
      # else any iPhone, else bare name" resolver. Shared with L1/L4/L5 via
      # the ensure-ios-simulator action so there is one source of truth.
      - name: Ensure ${{ matrix.device }} simulator
        id: sim
        uses: ./.github/actions/ensure-ios-simulator
        with:
          device: ${{ matrix.device }}
      - name: Run UI tests (resilient to simulator/runner flake)
        env:
          DESTINATION: ${{ steps.sim.outputs.destination }}
        run: |
          set -o pipefail
          echo "L3 destination -> $DESTINATION"
          # XCUITests flake at the infra layer on GitHub macOS runners:
          # cold-sim races + test-runner SIGKILL before bootstrap. Retry the
          # whole invocation up to 3x; within each run, retry individual
          # failed tests (-retry-tests-on-failure) so a single timing blip
          # doesn't sink the job.
          #
          # ScreenshotTests is SKIPPED here (T-704): it is a release-prep
          # marketing-capture harness, not a regression gate — it drives a
          # 424s live-network (WP REST) round-trip across every screen and was
          # the single source of L3 timeouts/cancellations across #72 + #101.
          # A blocking smoke gate must be fast + hermetic; the genuine
          # SmokeTests + RecipeDetailRatingsSmokeTests still run. Capture the
          # marketing shots on-demand (run the ScreenshotTests class directly).
          attempt=0
          until [ "$attempt" -ge 3 ]; do
            attempt=$((attempt + 1))
            echo "::group::L3 UI tests - attempt $attempt/3"
            if xcodebuild \
              -project DODApp.xcodeproj \
              -scheme DODApp \
              -destination "$DESTINATION" \
              -derivedDataPath DerivedData \
              ${{ matrix.only_testing }} \
              -skip-testing:DODAppUITests/ScreenshotTests \
              -retry-tests-on-failure -test-iterations 2 \
              test | xcpretty; then
              echo "::endgroup::"
              echo "L3 passed on attempt $attempt"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::L3 attempt $attempt failed - retrying after cooldown"
            sleep 15
          done
          echo "::error::L3 failed after 3 attempts"
          exit 1
      - name: Upload UI test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: DerivedData/Logs/Test/*.xcresult

  # L5: end-to-end user journeys. Gated by:
  #   1. `pull_request` events ONLY when the PR carries the `e2e` label,
  #   2. `push` to `main` (post-merge safety net),
  #   3. `workflow_dispatch` (manual escape hatch),
  #   4. `schedule` (nightly env-drift detector).
  # Reuses the `ios_sim` path filter so docs-only PRs that happen to be
  # `e2e`-labeled don't waste runner minutes. Skipped on every other PR;
  # the `ci-required` aggregator treats skipped as success. Spec trace:
  # AC-T5 / CL-58. See `CONTRIBUTING.md` § "Does my PR need E2E?" for
  # the PR-author checklist.
  test-e2e:
    name: L5 E2E User Journeys
    needs: [changes, build-app]
    if: >-
      (github.event_name == 'pull_request' &&
        contains(github.event.pull_request.labels.*.name, 'e2e') &&
        needs.changes.outputs.ios_sim == 'true')
      || github.event_name == 'push'
      || github.event_name == 'workflow_dispatch'
      || github.event_name == 'schedule'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26 (Swift 6 / iOS 26 SDK)
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
      - name: Cache Homebrew (xcodegen)
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: ${{ runner.os }}-brew-xcodegen-v2
      - name: Cache SPM (DerivedData SourcePackages)
        uses: actions/cache@v4
        with:
          path: DerivedData/SourcePackages
          key: ${{ runner.os }}-xcode26-srcpkgs-app-${{ hashFiles('Packages/*/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-xcode26-srcpkgs-app-
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Ensure iPhone 17 simulator
        id: sim
        uses: ./.github/actions/ensure-ios-simulator
      - name: Run E2E user journeys
        env:
          DESTINATION: ${{ steps.sim.outputs.destination }}
        run: |
          set -o pipefail
          xcodebuild \
            -project DODApp.xcodeproj \
            -scheme DODApp \
            -destination "$DESTINATION" \
            -derivedDataPath DerivedData \
            -only-testing:DODAppE2ETests \
            test | xcpretty
      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: DerivedData/Logs/Test/*.xcresult

  # Aggregate gate. Runs even when upstream jobs were skipped (e.g.
  # docs-only PR) so the PR can show a single green "CI required"
  # check regardless of which jobs actually executed. Fails if any
  # required upstream job failed; succeeds if they passed OR were
  # skipped because path filters / label gating excluded them.
  #
  # The advisory UI/E2E jobs (test-ui-smoke = L3, test-e2e = L5) are
  # deliberately NOT in this gate: they are slow and flaky, so blocking
  # the merge on them stalls PRs long after the real required checks
  # (lint/format/L1/L4/build-app) are green. They still run on every PR
  # (advisory) and on main, where `report-failures` rolls up any reds.
  #
  # test-unit-app (L1 · DODApp) is likewise advisory and NOT in this gate
  # (DUT-32): it needs build-app first, so the chain build-app (~3 min) +
  # app-target unit tests (~6 min) bounded the gate at ~9 min — over the
  # 5-min merge-gate budget. Dropping it leaves build-app (L4-class, ~4
  # min) as the slowest required job, so the gate clears under 5 min. The
  # job still runs advisory on every PR and on main, where
  # `report-failures` rolls up any reds. Most domain logic is covered by
  # test-unit-packages (still required); only App-target-bound types (e.g.
  # AppTab) lose merge-blocking coverage.
  ci-required:
    name: CI required
    needs: [changes, lint, format, test-unit-packages,
            test-snapshots-designsystem, build-app]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate result
        run: |
          # Each input is "success", "failure", "cancelled", or "skipped".
          # Skipped is fine (path filter or label gating excluded the
          # job); failure is not.
          for name in changes lint format test-unit-packages \
                     test-snapshots-designsystem build-app; do
            result_var="${name//-/_}_RESULT"
            echo "$name: ${!result_var:-not-run}"
          done
          if [[ "${{ needs.changes.result }}" == "failure" \
             || "${{ needs.lint.result }}" == "failure" \
             || "${{ needs.format.result }}" == "failure" \
             || "${{ needs.test-unit-packages.result }}" == "failure" \
             || "${{ needs.test-snapshots-designsystem.result }}" == "failure" \
             || "${{ needs.build-app.result }}" == "failure" ]]; then
            echo "::error::At least one required CI job failed."
            exit 1
          fi
          echo "All required CI jobs passed (or were skipped by path filter / label gating)."

  # Auto-file a single rollup bug in Linear when the suite goes red on main.
  # Reporter only: it never fails the build (the gate is `ci-required` above).
  #
  # Gating: `failure()` is true only when at least one job in `needs` failed;
  # combined with the ref guard this job is a strict no-op on green runs and on
  # EVERY pull request (PR runs have github.ref = refs/pull/<n>/merge, not
  # refs/heads/main). The filer itself is also idempotent by commit SHA, so a
  # re-run on the same red commit updates the existing issue instead of filing
  # a duplicate. See bin/file_test_bugs.py and Marketing/CICD.md.
  report-failures:
    name: Report failures to Linear
    needs: [changes, lint, format, test-unit-packages, test-unit-app,
            test-snapshots-designsystem, build-app, test-ui-smoke,
            test-e2e]
    if: ${{ failure() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: File rollup bug in Linear
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          # The whole needs.* context as JSON: { "<job>": { "result": ... } }.
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          # Build --failed-jobs from the job ids whose result is "failure".
          # (cancelled/skipped are not "failure" and are intentionally ignored;
          # a cancelled run is usually a superseded push, not a real red.)
          failed=$(printf '%s' "$NEEDS_JSON" \
            | jq -r 'to_entries
                     | map(select(.value.result == "failure") | .key)
                     | join(",")')
          echo "Failed jobs: ${failed:-<none>}"

          if [ -z "$failed" ]; then
            echo "No jobs in the failure() set resolved to result==failure; nothing to file."
            exit 0
          fi
          if [ -z "${LINEAR_API_KEY:-}" ]; then
            echo "::warning::LINEAR_API_KEY secret is not set; skipping Linear bug filing."
            echo "Add it under Settings -> Secrets and variables -> Actions (see Marketing/CICD.md)."
            exit 0
          fi

          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Reporter must never fail the build: swallow any filer error to a
          # warning. The required gate is `ci-required`, which already failed.
          python3 bin/file_test_bugs.py \
            --sha "${{ github.sha }}" \
            --run-url "$run_url" \
            --failed-jobs "$failed" \
          || echo "::warning::file_test_bugs.py failed; see log above. Not failing the build (reporter only)."
