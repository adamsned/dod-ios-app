name: CI

on:
  pull_request:
    branches: [main]
    # The label-conditional `test-e2e` job (below) reads
    # `github.event.pull_request.labels.*.name`. The `labeled` /
    # `unlabeled` events are required so the job re-evaluates when an
    # author adds or removes the `e2e` label after the PR is opened.
    # Without these triggers the job would only see the labels present
    # at PR-open time. Spec trace: AC-T5 / CL-58.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  # L5 E2E nightly safety net + manual escape hatch. Pairs with
  # `nightly-live-api.yml`'s cron at the same 07:00 UTC so both early
  # warning surfaces fire at the same wall clock. Spec trace:
  # AC-T5 / CL-58.
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Path filtering — docs/spec/marketing-only changes don't need the
# (expensive) macOS-runner pipeline. The "code-changed" job is the
# single source of truth: every downstream job reads it.
jobs:
  changes:
    name: Detect path changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ steps.filter.outputs.code }}
      ios_sim: ${{ steps.filter.outputs.ios_sim }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          # `code` triggers lint/format/L1. `ios_sim` triggers the
          # heavy iOS-Simulator jobs (snapshot, build, UI smoke).
          # iOS-Sim is gated more strictly so a Linux-only fix
          # (e.g. README, spec, CONTRIBUTING) doesn't pay simulator
          # boot time.
          filters: |
            code:
              - 'App/**'
              - 'Packages/**'
              - 'project.yml'
              - '.swift-format'
              - '.swiftlint.yml'
              - 'bin/**'
              - '.github/workflows/ci.yml'
            ios_sim:
              - 'App/**'
              - 'Packages/**'
              - 'project.yml'
              - '.github/workflows/ci.yml'

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Run SwiftLint (strict)
        run: bin/lint.sh

  format:
    name: Format check
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install swift-format
        run: brew install swift-format
      - name: Check formatting
        run: swift-format lint --recursive --strict --configuration .swift-format App AppTests Packages

  # L1: all package unit tests in ONE macOS job. We previously ran
  # this as a 10-job matrix; each parallel job has a ~60s billed
  # minimum on macOS, so the matrix burned ~10 macOS minutes per push
  # for ~30s of actual work. Serial drops total billed time ~3-4x.
  # Trade-off: wall-clock test time is longer (~3-4min vs ~30s
  # parallel) but unit tests are tiny so it barely matters.
  test-unit-packages:
    name: L1 Unit · all packages
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26 (Swift 6 / iOS 26 SDK)
        # All packages declare swift-tools-version: 6.0. The macos-15
        # runner's default Xcode is 16.4; we pin the newest Xcode 26 so the
        # toolchain + iOS 26 SDK match local dev (where the snapshot
        # baselines are recorded) and so the iOS-Simulator jobs find the
        # iPhone 17 sim. GitHub does NOT ship a bare `Xcode_26.app` symlink
        # (only versioned paths like Xcode_26.3.app), so glob + sort -V +
        # tail -1 picks the newest installed 26.x — robust across image
        # updates that bump the patch version.
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
      - name: Cache SPM build outputs
        uses: actions/cache@v4
        with:
          path: |
            Packages/*/.build
          key: ${{ runner.os }}-spm-xcode26-${{ hashFiles('Packages/*/Package.swift') }}
      - name: Test all packages sequentially
        # Bash loop so a single failure surfaces clearly. `set -e`
        # makes the loop fail-fast at the first broken package.
        run: |
          set -e
          for pkg in DODDomain DODSupport DODAnalytics DODNetworking \
                     DODPersistence DODFeatureFeed DODFeatureCategories \
                     DODFeatureSearch DODFeatureRecipeDetail DODFeatureSaved; do
            echo "::group::swift test — $pkg"
            (cd "Packages/$pkg" && swift test --parallel)
            echo "::endgroup::"
          done

  # L4: DesignSystem snapshots run on iOS simulator (UIKit dependency).
  test-snapshots-designsystem:
    name: L4 Snapshots · DODDesignSystem
    needs: [changes, lint, format]
    if: needs.changes.outputs.ios_sim == 'true'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26 (Swift 6 / iOS 26 SDK)
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
      - name: Test on iOS simulator
        working-directory: Packages/DODDesignSystem
        run: |
          set -o pipefail
          xcodebuild \
            -scheme DODDesignSystem \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            test | xcpretty
      - name: Upload snapshot diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-diffs
          path: Packages/DODDesignSystem/Tests/DODDesignSystemTests/__Snapshots__/

  build-app:
    name: Build app (iOS Simulator)
    needs: [changes, lint, format]
    if: needs.changes.outputs.ios_sim == 'true'
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26 (Swift 6 / iOS 26 SDK)
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project DODApp.xcodeproj \
            -scheme DODApp \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -configuration Debug \
            build | xcpretty

  # L1 (host-app slice): unit tests against App-target types that can't
  # be lifted into a feature package — currently just AppTab. Most domain
  # logic still lives in Packages/*/Tests/ (test-unit-packages above).
  # Gated behind the iOS-Sim path filter since it depends on xcodebuild +
  # the simulator; skipped on docs-only PRs.
  test-unit-app:
    name: L1 Unit · DODApp
    needs: [changes, build-app]
    if: needs.changes.outputs.ios_sim == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26 (Swift 6 / iOS 26 SDK)
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild \
            -project DODApp.xcodeproj \
            -scheme DODApp \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -only-testing:DODAppUnitTests \
            test | xcpretty

  # L3: UI smoke tests against the built app on a live simulator.
  test-ui-smoke:
    name: L3 UI Smoke
    needs: [changes, build-app]
    if: needs.changes.outputs.ios_sim == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26 (Swift 6 / iOS 26 SDK)
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Run UI tests (resilient to simulator/runner flake)
        run: |
          set -o pipefail
          # Resolve an actually-available iPhone simulator instead of
          # hardcoding a device name a given runner image may lack. Observed
          # flake: "Unable to find a device ... name:iPhone 17" on an
          # otherwise-healthy runner. Prefer iPhone 17; else the first
          # available iPhone; else fall back to the pinned name.
          device_id=$(xcrun simctl list devices available --json | jq -r '
            ([.devices[][] | select(.name == "iPhone 17")] | first)
            // ([.devices[][] | select(.name | startswith("iPhone"))] | first)
            | .udid // empty')
          if [ -n "$device_id" ]; then
            destination="platform=iOS Simulator,id=$device_id"
            # Warm-boot so the test runner doesn't race a cold simulator.
            xcrun simctl boot "$device_id" 2>/dev/null || true
          else
            destination="platform=iOS Simulator,name=iPhone 17"
          fi
          echo "L3 destination -> $destination"
          # XCUITests flake at the infra layer on GitHub macOS runners:
          # cold-sim races, test-runner SIGKILL before bootstrap, and the
          # long live-network marketing-screenshot capture. Retry the whole
          # invocation up to 3x; within each run, retry individual failed
          # tests (-retry-tests-on-failure) so a single timing blip in one
          # test doesn't sink the job.
          attempt=0
          until [ "$attempt" -ge 3 ]; do
            attempt=$((attempt + 1))
            echo "::group::L3 UI tests - attempt $attempt/3"
            if xcodebuild \
              -project DODApp.xcodeproj \
              -scheme DODApp \
              -destination "$destination" \
              -only-testing:DODAppUITests \
              -retry-tests-on-failure -test-iterations 2 \
              test | xcpretty; then
              echo "::endgroup::"
              echo "L3 passed on attempt $attempt"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::L3 attempt $attempt failed - retrying after cooldown"
            sleep 15
          done
          echo "::error::L3 failed after 3 attempts"
          exit 1
      - name: Upload UI test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult

  # L5: end-to-end user journeys. Gated by:
  #   1. `pull_request` events ONLY when the PR carries the `e2e` label,
  #   2. `push` to `main` (post-merge safety net),
  #   3. `workflow_dispatch` (manual escape hatch),
  #   4. `schedule` (nightly env-drift detector).
  # Reuses the `ios_sim` path filter so docs-only PRs that happen to be
  # `e2e`-labeled don't waste runner minutes. Skipped on every other PR;
  # the `ci-required` aggregator treats skipped as success. Spec trace:
  # AC-T5 / CL-58. See `CONTRIBUTING.md` § "Does my PR need E2E?" for
  # the PR-author checklist.
  test-e2e:
    name: L5 E2E User Journeys
    needs: [changes, build-app]
    if: >-
      (github.event_name == 'pull_request' &&
        contains(github.event.pull_request.labels.*.name, 'e2e') &&
        needs.changes.outputs.ios_sim == 'true')
      || github.event_name == 'push'
      || github.event_name == 'workflow_dispatch'
      || github.event_name == 'schedule'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26 (Swift 6 / iOS 26 SDK)
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Run E2E user journeys
        run: |
          set -o pipefail
          xcodebuild \
            -project DODApp.xcodeproj \
            -scheme DODApp \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -only-testing:DODAppE2ETests \
            test | xcpretty
      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult

  # Aggregate gate. Runs even when upstream jobs were skipped (e.g.
  # docs-only PR) so the PR can show a single green "CI required"
  # check regardless of which jobs actually executed. Fails if any
  # required upstream job failed; succeeds if they passed OR were
  # skipped because path filters / label gating excluded them.
  ci-required:
    name: CI required
    needs: [changes, lint, format, test-unit-packages, test-unit-app,
            test-snapshots-designsystem, build-app, test-ui-smoke,
            test-e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate result
        run: |
          # Each input is "success", "failure", "cancelled", or "skipped".
          # Skipped is fine (path filter or label gating excluded the
          # job); failure is not. test-e2e specifically: PRs without the
          # `e2e` label see this job as skipped, which is success.
          for name in changes lint format test-unit-packages test-unit-app \
                     test-snapshots-designsystem build-app test-ui-smoke \
                     test-e2e; do
            result_var="${name//-/_}_RESULT"
            echo "$name: ${!result_var:-not-run}"
          done
          if [[ "${{ needs.changes.result }}" == "failure" \
             || "${{ needs.lint.result }}" == "failure" \
             || "${{ needs.format.result }}" == "failure" \
             || "${{ needs.test-unit-packages.result }}" == "failure" \
             || "${{ needs.test-unit-app.result }}" == "failure" \
             || "${{ needs.test-snapshots-designsystem.result }}" == "failure" \
             || "${{ needs.build-app.result }}" == "failure" \
             || "${{ needs.test-ui-smoke.result }}" == "failure" \
             || "${{ needs.test-e2e.result }}" == "failure" ]]; then
            echo "::error::At least one required CI job failed."
            exit 1
          fi
          echo "All required CI jobs passed (or were skipped by path filter / label gating)."
